name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - uses: pnpm/setup@v3
              with:
                  runtime: node@24
                  cache: true
                  require-lockfile: true
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/api
            - run: pnpm prettier:check
            - run: pnpm --filter @agents/api run lint:check
            - run: pnpm --filter @agents/api run test
            - run: pnpm --filter @agents/cdk run lint:check
            - run: pnpm --filter @agents/cdk run check-types
            - run: pnpm --filter @agents/cdk run test
